<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Lost & Found - CollegeBuddy</title>

    <link rel="stylesheet" href="./css/add-lost-found.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            College<span>Buddy</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="lost-found.html" class="active">
                Lost & Found
            </a>
        </div>

        <a href="profile.html" class="profile">
            👤 Profile
        </a>

    </nav>


    <main>

        <div class="page-header">

            <a href="lost-found.html" class="back">
                ← Back to Lost & Found
            </a>

            <h1>Report an Item</h1>

            <p>
                Help your college community find lost belongings.
            </p>

        </div>


        <form id="lostFoundForm">

            <!-- TYPE -->

            <div class="form-group">

                <label>
                    What are you reporting?
                </label>

                <div class="type-options">

                    <label class="type-card lost-option">

                        <input
                            type="radio"
                            name="type"
                            value="lost"
                            checked
                        >

                        <span class="type-icon">
                            🔴
                        </span>

                        <span>
                            <strong>Lost</strong>
                            <small>I lost this item</small>
                        </span>

                    </label>


                    <label class="type-card found-option">

                        <input
                            type="radio"
                            name="type"
                            value="found"
                        >

                        <span class="type-icon">
                            🟢
                        </span>

                        <span>
                            <strong>Found</strong>
                            <small>I found this item</small>
                        </span>

                    </label>

                </div>

            </div>


            <!-- TITLE -->

            <div class="form-group">

                <label for="title">
                    Item Name
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="e.g. Black Lenovo Laptop"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the item, color, identifying marks, etc."
                    required
                ></textarea>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="electronics">
                        Electronics
                    </option>

                    <option value="documents">
                        Documents / ID
                    </option>

                    <option value="clothing">
                        Clothing
                    </option>

                    <option value="accessories">
                        Accessories
                    </option>

                    <option value="books">
                        Books
                    </option>

                    <option value="keys">
                        Keys
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="e.g. Library, 2nd Floor"
                    required
                >

            </div>


            <!-- CONTACT -->

            <div class="form-group">

                <label for="contactNumber">
                    Contact Number
                </label>

                <input
                    type="tel"
                    id="contactNumber"
                    placeholder="Your contact number"
                    required
                >

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label for="image">
                    Item Image
                </label>

                <input
                    type="file"
                    id="image"
                    accept="image/*"
                >

                <small>
                    Upload an image of the item. This is optional.
                </small>

            </div>


            <!-- PREVIEW -->

            <div
                id="imagePreview"
                class="image-preview hidden"
            >
            </div>


            <button
                type="submit"
                id="submitBtn"
            >
                Report Item
            </button>


            <p id="message"></p>

        </form>

    </main>


    <script src="./js/add-lost-found.js"></script>

</body>

</html>
